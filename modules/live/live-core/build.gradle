plugins {
    id 'java-library'
}

dependencies {
    api(project(':storage:db-core'))
    implementation(project(':storage:redis-core'))
    implementation(project(':common:core'))
    implementation(project(':common:global'))
    implementation(project(':modules:live:live-api'))

    api 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 관측 계측(포트 구현). actuator 는 여기 두지 않는다 — 엔드포인트 노출은 앱의 결정이고,
    // live-core 를 쓰는 다른 앱이 원치 않는 엔드포인트를 끌고 오면 안 된다.
    implementation 'io.micrometer:micrometer-core'
    // 프로메테우스 레지스트리는 SimpleMeterRegistry 보다 규칙이 엄격하다(같은 이름의 태그 키 집합이
    // 다르면 거부). 운영에서만 드러나는 그 차이를 테스트로 잡으려면 테스트 클래스패스에 필요하다.
    testImplementation 'io.micrometer:micrometer-registry-prometheus'

    // LiveKit (WebRTC)
    implementation 'io.livekit:livekit-server:0.12.1'

    // 채팅 입장용 룸 토큰(RS256) 서명 — api-app 인증 토큰(HMAC)과 별개
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'

    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // FixtureMonkey
    testImplementation "com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.19"
}

tasks.register("prepareKotlinBuildScriptModel"){}
