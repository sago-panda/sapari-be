dependencies {
    implementation project(':common:web')
    implementation(project(":modules:live:live-api"))
    implementation(project(":modules:live:live-core"))

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 정리 스케줄러 분산 락. 락 저장소는 Postgres — live-app 에 Redis 의존성이 없고(추가 대상이 늘어난다),
    // 이 락은 파괴적 외부 호출(LiveKit 삭제/중단)을 지키므로 캐시 취급인 Redis 보다 정본 DB 가 맞다.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.6.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.6.0'

    // 프로메테우스 스크레이프 엔드포인트. runtimeOnly — 코드가 직접 참조하지 않는다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.19"

    // 락 경합 테스트는 인스턴스 2개가 같은 락 저장소를 보는 상황이 전부라 진짜 Postgres 가 필요하다.
    // 인메모리 DB 로 바꾸면 검증 대상(운영과 같은 프로바이더·같은 DDL)이 사라진다.
    testImplementation 'org.testcontainers:postgresql:1.21.3'
    testRuntimeOnly 'org.postgresql:postgresql'
}

tasks.register("prepareKotlinBuildScriptModel"){}

bootJar {
    enabled = true
}

// architecture-test가 liveapp 클래스를 분석하려면 plain jar 필요 (bootJar는 BOOT-INF 구조라 분석 불가)
jar{
    enabled = true
}

