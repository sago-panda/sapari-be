dependencies {
    implementation project(':common:web')
    implementation(project(":modules:live:live-api"))
    implementation(project(":modules:live:live-core"))

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 프로메테우스 스크레이프 엔드포인트. runtimeOnly — 코드가 직접 참조하지 않는다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.19"
}

tasks.register("prepareKotlinBuildScriptModel"){}

bootJar {
    enabled = true
}

// architecture-test가 liveapp 클래스를 분석하려면 plain jar 필요 (bootJar는 BOOT-INF 구조라 분석 불가)
jar{
    enabled = true
}
