dependencies {
    implementation project(':common:web')
    implementation project(':common:page')   // 예정 방송 목록 CursorPage

    // 폐기 조회(TokenRevocationFilter)가 쓰는 정본 리더 둘 — AccessTokenBlacklistRedisRepository ·
    // SessionRevocationRedisRepository. 키 규약(TokenStoreKeys)을 세 번째 자리에 복제하는 대신
    // 읽는 구현을 그대로 재사용한다. 이 모듈은 파일 3개이고 JPA·UserDetailsService·user DB 를
    // 갖지 않으므로, LiveAppApplication 이 경계로 삼는 "발급/갱신 쪽 stateful 자산" 은
    // RefreshTokenRedisRepository 하나다 — 그건 거기서 스캔 제외한다.
    implementation project(':common:auth')
    implementation(project(":modules:live:live-api"))
    implementation project(':common:page')   // 판매자 내 방 목록 응답(CursorPage)
    implementation(project(":modules:live:live-core"))

    // 강퇴 REST. chat-core 는 리액티브 스타터를 함께 끌고 오는데(streaming-app 과 한 모듈을 공유한다),
    // 이 앱은 그 스택을 쓰지 않는다 — LiveAppApplication 이 com.sapari.chat 을 스캔에서 빼고
    // ChatModerationBeansConfig 가 블로킹 조각만 골라 등록한다.
    implementation(project(":modules:chat:chat-api"))
    implementation(project(":modules:chat:chat-core"))

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 정리 스케줄러 분산 락. 락 저장소는 Postgres — live-app 에 Redis 의존성이 없고(추가 대상이 늘어난다),
    // 이 락은 파괴적 외부 호출(LiveKit 삭제/중단)을 지키므로 캐시 취급인 Redis 보다 정본 DB 가 맞다.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.6.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.6.0'

    // 프로메테우스 스크레이프 엔드포인트. runtimeOnly — 코드가 직접 참조하지 않는다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // 강퇴 경로가 쓰는 블로킹 템플릿(MongoTemplate·StringRedisTemplate)을 이 앱이 직접 세운다.
    // chat-core 는 리액티브 스타터만 갖고 있고 그마저 implementation 이라 여기로 넘어오지 않는다 —
    // 그 모듈의 다른 소비자(streaming-app)가 동기 드라이버를 물려받지 않게 하려는 의도된 경계다.
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.19"
    // 인가 규칙을 컨텍스트 전체를 띄우지 않고 검사하기 위한 둘.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // 컨텍스트를 CI 에서도 띄우기 위한 것들. 종전에는 @Tag("context") 로 CI 에서 제외했고 그 근거가
    // "설정을 CI 변수로 채우려면 룸토큰 개인키를 CI 에 넣어야 한다" 였는데, 키는 외부 의존 없는
    // 프로퍼티라 테스트가 직접 만들 수 있다 — 그래서 시크릿 없이 돈다.
    //
    // 락 경합 테스트도 같은 컨테이너를 쓴다 — 인스턴스 2개가 같은 락 저장소를 보는 상황이 전부라
    // 진짜 Postgres 가 필요하고, 인메모리 DB 로 바꾸면 검증 대상(운영과 같은 프로바이더·같은 DDL)이
    // 사라진다. 버전은 BOM 하나로 <b>선언</b>한다 — dev 쪽이 1.21.3 을 직접 박고 있었는데 다른
    // 모듈은 전부 이 BOM(1.20.4)을 쓰므로, 선언을 한 자리로 모은다.
    //
    // ⚠️ 다만 <b>해소는 한 버전이 아니다</b>(실측: dependencyInsight). spring-boot-testcontainers
    // 4.0.6 이 org.testcontainers:testcontainers 를 2.0.5 로 직접 끌어오고 그 관리 버전이 이 BOM 의
    // 제약을 이긴다("Selected by rule" + "By constraint") — 코어만 2.0.5 이고
    // junit-jupiter·postgresql·mongodb·jdbc·database-commons 는 1.20.4 로 남아 메이저 둘이 한
    // 클래스패스에 공존한다. 현재 전 테스트가 통과하므로 동작 문제는 아니지만, "두 버전을 두지
    // 않는다" 는 선언에만 참이다. 진짜로 한 버전으로 모으려면 BOM 대신 Boot 의 관리 버전을 쓰거나
    // testcontainers.version 프로퍼티를 덮어써야 하고, 그건 다섯 모듈의 동시 변경이다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:mongodb'
    testRuntimeOnly 'org.postgresql:postgresql'
    // 스키마는 <b>운영과 같은 러너로</b> 세운다. 손수 SQL 을 읽는 로더를 또 만들면 "전부, 순서대로"
    // 라는 규칙이 네 번째 자리에 흩어진다(chat 의 LiveSchema javadoc 이 경고한 그 모양).
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
}

tasks.register("prepareKotlinBuildScriptModel"){}

bootJar {
    enabled = true
}

// architecture-test가 liveapp 클래스를 분석하려면 plain jar 필요 (bootJar는 BOOT-INF 구조라 분석 불가)
jar{
    enabled = true
}

