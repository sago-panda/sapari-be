dependencies {
    implementation project(':common:security-jwt')
    implementation project(':common:core')              // chat 예외 조상 BusinessException (핸들러 에러 매핑 instanceof)
    implementation project(':modules:chat:chat-core')   // chat 도메인·포트(ChatSession, ChatKickRepository, ChatSessionRepository 등)
    implementation project(':modules:chat:chat-api')    // 핸들러가 쓰는 계약(SendChatUseCase·SendChatCommand·ChatMessageView)
    implementation 'io.livekit:livekit-server:0.12.1'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'   // 핸들러 ObjectMapper(Instant)

    // 관측 배선 테스트가 실제 레지스트리로 카운터를 읽는다. chat-core 의 micrometer 는 implementation
    // 스코프라 여기까지 새지 않는다 — 운영에서 레지스트리를 세우는 것은 actuator 의 몫이다.
    testImplementation 'io.micrometer:micrometer-core'

    testImplementation 'io.projectreactor:reactor-test'   // StepVerifier (reactive 단위 테스트)

    // C6 WS 통합테스트 — @SpringBootTest(RANDOM_PORT) + Redis/Mongo 컨테이너 + reactive WS 클라
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mongodb'
}

tasks.register("prepareKotlinBuildScriptModel"){}

bootJar {
    enabled = true
}

// architecture-test가 streamingapp 클래스를 분석하려면 plain jar 필요 (bootJar는 BOOT-INF 구조라 분석 불가)
jar{
    enabled = true
}
