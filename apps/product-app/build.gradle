dependencies {
    implementation project(':common:web')
    implementation project(':common:auth')
    implementation project(':modules:product:product-api')
    implementation project(':modules:product:product-core')
    implementation project(':modules:user:user-core')
    implementation project(':storage:redis-core')

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 상품 대량 등록 엑셀(xlsx) 스트리밍 읽기 — Boot BOM 미관리라 버전 고정
    implementation 'org.apache.poi:poi-ooxml:5.4.1'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.19'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 대량 등록 rate limit(Lua 스크립트·TTL)을 실제 Redis로 검증
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

tasks.register("prepareKotlinBuildScriptModel"){}

bootJar {
    enabled = true
}

jar{
    enabled = false
}