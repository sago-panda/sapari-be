# 결정론적 차단 게이트 — 빌드와 아키텍처 테스트.
#
# 신뢰 경계 (읽고 넘기지 말 것):
#   이 잡은 파이프라인에서 유일하게 MR 코드를 '실행'한다. Gradle 은 MR 의 build.gradle 과
#   gradle-wrapper.properties(배포판 URL)를 실행하므로, MR 작성자는 러너에서 임의 코드를
#   돌릴 수 있다. 리뷰 잡(mr-review)은 여전히 diff 를 데이터로만 읽으며, 실행하지 않는다.
#
#   이것이 새로 연 구멍은 아니다. mr-review.yml 상단이 이미 "MR 작성자가 CI 파일을 고쳐
#   토큰을 추출할 수 있다"를 전제로 적고 있다 — 신뢰 경계는 원래부터 'MR 작성자를 신뢰한다'
#   이고, 이 잡은 그 경로를 CI yml 수정에서 build.gradle 수정으로 넓혔을 뿐이다.
#   달라진 것은 가시성이다. CI 파일 변경은 눈에 띄지만 빌드 파일 변경은 일상적이다.
#   그래서 .claude/anchors.yml 이 **/*.gradle 을 하네스 경로로 잡아 SEC-05/SEC-09 를 켠다.
#
#   이 전제가 깨지는 때 — 외부 기여자, 포크 MR, 신뢰 범위 밖 계정 — 에는 이 잡을 그대로
#   두면 안 된다. 격리 러너(전용 태그 + 네트워크 제한)로 옮기거나, CI_JOB_TOKEN 허용목록을
#   좁히는 것이 먼저다. 잡 안에서 변수를 비우는 것은 CI yml 수정 경로가 남아 방어가 되지 않는다.
#
# 리뷰(mr-review.yml)와 역할이 갈린다. 차단하는 것은 결과가 재현되는 검사뿐이다:
# 같은 커밋에 같은 결과가 나오는 Gradle/ArchUnit 은 머지를 막고, LLM 리뷰는 지적만 남긴다.
#
# precheck 앞 스테이지에 두는 이유는 두 가지다.
#  - 빌드가 깨진 MR 에 리뷰 토큰을 쓰지 않는다
#  - ArchUnit 이 잡는 위반을 리뷰어가 중복 지적하지 않는다 (sapari-reviewer.md 의 전제)
build:
  stage: build
  image: eclipse-temurin:21-jdk
  # 재리뷰(FORCE_REVIEW) 분기는 넣지 않는다. 리뷰 버튼을 눌렀다고 코드가 바뀌지는 않는다.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    CLAUDE_CODE_OAUTH_TOKEN: "" # claude 미실행 단계
    GITLAB_API_TOKEN: "" # API 호출 없음
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
    paths:
      - .gradle/wrapper
      - .gradle/caches
  script:
    # architecture-test:test 는 build 에 포함된다. 명시하면 어느 검사가 막았는지 로그에서 갈린다.
    - ./gradlew build --console=plain
  artifacts:
    when: on_failure # 통과하면 남길 것이 없다
    paths:
      # 실패한 테스트의 리포트만. 리포트 전체를 올리면 스택트레이스에 섞인
      # 설정값과 픽스처 데이터까지 아티팩트로 남는다.
      - "architecture-test/build/reports/tests/"
    expire_in: 3 days

# 하네스(리뷰 설정) 정합성 검사. 빌드와 나누는 이유는 두 가지다.
#  - JDK 이미지에는 python3 가 없다. 검사만 하려고 빌드 이미지에 설치하지 않는다
#  - 실패 원인이 갈린다. "코드가 깨졌다" 와 "리뷰 설정이 어긋났다" 는 다른 문제다
harness-check:
  stage: build
  image: python:3.12-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    CLAUDE_CODE_OAUTH_TOKEN: ""
    GITLAB_API_TOKEN: ""
  script:
    # 리뷰어 md 의 ArchUnit 목록이 실제 규칙과 어긋나는가
    - sh .claude/scripts/check-archunit-sync.sh
    # anchors.yml 이 켜는 ID 가 리뷰어 md 에 실재하는가. 없는 ID 를 켜면 그 규칙은
    # 아무 일도 하지 않는데, 로그만 보면 켜진 것처럼 보인다.
    - sh .claude/scripts/check-item-ids.sh
