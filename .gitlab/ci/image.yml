# 이미지 빌드·ECR 푸시 (live-app, streaming-app, migration).
#
# dev 브랜치 push 에서만 돈다. MR 단계의 검증은 build 잡(테스트·ArchUnit)이 이미 맡았고,
# 이 잡은 "머지된 코드를 배포 가능한 산출물로 만든다" 만 한다. Dockerfile 의 bootJar 는
# 테스트를 돌리지 않는다 — 테스트를 여기서 한 번 더 돌리지 않는 이유가 이것이다.
#
# 인증 (읽고 넘기지 말 것):
#   AWS 정적 키를 CI 변수에 두지 않는다. GitLab 이 잡마다 발급하는 OIDC 토큰(id_tokens)으로
#   ECR_PUSH_ROLE_ARN 역할을 맡는다. 역할 쪽 신뢰 조건이 sub 를
#   project_path:sagopanda/sapari-be:ref_type:branch:ref:dev 로 묶으므로, MR 작성자가 자기
#   브랜치에서 이 파일을 고쳐도 역할을 맡지 못한다 — 토큰의 ref 클레임은 GitLab 이 서명한다.
#   (mr-review.yml 의 리뷰 토큰과 다른 점이 이것이다. 그쪽은 변수 자체가 잡 환경에 들어간다.)
#   dev 가 보호 브랜치가 아니면 이 전제가 무너진다 — 누구나 dev 에 push 할 수 있으면 누구나
#   역할을 맡는다. 신뢰 조건에 ref_protected=true 를 더하면 그 경우에도 막힌다.
#
# dind: build 잡과 같은 배선이다(2375, TLS 끔). 그쪽 상단의 신뢰 경계 문단이 그대로 적용된다 —
#   이 잡은 dev 에 머지된 코드만 실행하므로 범위는 오히려 좁다.
#
# 필요 CI 변수 (Settings > CI/CD > Variables, 비밀 아님 — Masked 불필요):
#   ECR_PUSH_ROLE_ARN  Terraform 10-identity 의 ci-ecr-push 역할 ARN
#   ECR_REGISTRY       <계정ID>.dkr.ecr.ap-northeast-2.amazonaws.com
#
# 리포지토리 이름 규칙: sapari-<ENVIRONMENT>-<앱> (21-registry 스택의 이름 규칙과 같다)
#
# 아키텍처: EKS 노드가 Graviton(arm64)이라 linux/arm64 로 만든다. 러너는 amd64 다.
#   Dockerfile 의 빌드 단계는 --platform=$BUILDPLATFORM 이라 gradle 은 러너에서 네이티브로 돌고,
#   실행 단계에는 RUN 이 없어 에뮬레이션(QEMU)이 필요 없다. 기반 이미지 digest 는 두 아키텍처를
#   모두 담은 manifest list 다. 실행 단계에 RUN 을 추가하면 이 잡에 binfmt 설치가 필요해진다.
#
# 언제 도는가: 그 앱 이미지에 들어가는 코드가 바뀐 dev push 에서만 돈다.
#   경로 목록은 gradle 의존성(apps/<앱>/build.gradle 의 project(...)와 그 하위)을 따라 만들었다.
#   앱이 새 모듈에 의존하게 되면 아래 목록을 같이 고친다 — 빠뜨리면 그 모듈만 바뀐 push 에서
#   이미지가 올라가지 않는다. common/ · storage/ 는 통째로 넣어 덜 빠뜨리는 쪽을 택했다.
#   dev 에서 손으로 띄운 파이프라인(Run pipeline)은 변경과 상관없이 세 이미지를 모두 올린다(이미 있는 태그는 건너뛴다).
#   홈랩 앱(api-app 등)은 ECR 이 아니라 GitLab Container Registry 경로(sapari-cicd-template)로 간다.

# stages 선언은 .gitlab-ci.yml 이 소유한다 (include 간 덮어쓰기 방지).

.image-publish:
  stage: publish
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    AWS_REGION: "ap-northeast-2"
    ENVIRONMENT: "dev"
    CLAUDE_CODE_OAUTH_TOKEN: "" # claude 미실행 단계
    GITLAB_API_TOKEN: "" # API 호출 없음
  before_script:
    # 변수가 비면 aws cli 가 엉뚱한 자격 체인을 찾다가 알아보기 어려운 오류를 낸다. 먼저 끊는다.
    - test -n "$ECR_PUSH_ROLE_ARN" || { echo "ECR_PUSH_ROLE_ARN 이 비어 있습니다"; exit 1; }
    - test -n "$ECR_REGISTRY" || { echo "ECR_REGISTRY 가 비어 있습니다"; exit 1; }
    - apk add --no-cache aws-cli >/dev/null
    # aws cli 는 이 세 변수가 있으면 AssumeRoleWithWebIdentity 를 스스로 부른다.
    - echo "$AWS_ID_TOKEN" > /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
    - export AWS_ROLE_ARN="$ECR_PUSH_ROLE_ARN"
    - export AWS_ROLE_SESSION_NAME="gitlab-$CI_PIPELINE_ID-$APP"
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    # 태그는 커밋 SHA 하나. latest 를 쓰지 않는다 — 어느 커밋이 떠 있는지 이미지 이름으로 갈려야
    # 롤백이 "이전 SHA 로 되돌리기" 한 줄이 된다.
    - REPO="sapari-$ENVIRONMENT-$APP"
    - IMAGE="$ECR_REGISTRY/$REPO:$CI_COMMIT_SHORT_SHA"
    # ECR 태그가 IMMUTABLE 이라 같은 SHA 로 다시 돌면(재시도·수동 실행) 푸시가
    # ImageTagAlreadyExistsException 으로 실패한다. 이미 있으면 건너뛴다.
    # 조회가 권한 등 다른 이유로 실패하면 그대로 빌드·푸시로 진행해 거기서 오류가 드러나게 둔다.
    - |
      if aws ecr describe-images --region "$AWS_REGION" --repository-name "$REPO" --image-ids imageTag="$CI_COMMIT_SHORT_SHA" >/dev/null 2>&1; then
        echo "이미 있음, 건너뜀 $IMAGE"
        exit 0
      fi
    # provenance 는 끈다. 켜면 단일 플랫폼이어도 인덱스+attestation 매니페스트가 붙어
    # ECR 에 태그 없는 항목이 하나씩 더 생긴다.
    - docker buildx build --platform linux/arm64 --provenance=false -f "${DOCKERFILE:-apps/$APP/Dockerfile}" -t "$IMAGE" --push .
    - echo "푸시 완료 $IMAGE"

# 공통 경로(common · storage · chat · user-api · 빌드 설정)는 두 잡에 똑같이 적는다. 하나를 고치면 둘 다 고친다.
# (YAML 앵커로 합치면 rules:changes 에 중첩 목록이 들어가 GitLab 이 펼쳐 주지 않는다)

image-publish:live-app:
  extends: .image-publish
  variables:
    APP: live-app
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes:
        - apps/live-app/**/*
        - modules/live/**/*
        - common/**/*
        - storage/**/*
        - modules/chat/**/*
        - modules/user/user-api/**/*
        - build.gradle
        - settings.gradle
        - gradle/**/*
        - gradlew
        - .dockerignore
        - .gitlab/ci/image.yml

image-publish:streaming-app:
  extends: .image-publish
  variables:
    APP: streaming-app
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes:
        - apps/streaming-app/**/*
        - modules/live/live-api/**/*
        - common/**/*
        - storage/**/*
        - modules/chat/**/*
        - modules/user/user-api/**/*
        - build.gradle
        - settings.gradle
        - gradle/**/*
        - gradlew
        - .dockerignore
        - .gitlab/ci/image.yml

# 마이그레이션 이미지(flyway + db/migration + migrate.sh). 클라우드 Job 은 MIGRATE_SCHEMAS 로 대상 스키마를 고른다.
# 실행 단계에 RUN 이 없어야 한다 — 위 아키텍처 문단 참고(Dockerfile 이 COPY --chmod 를 쓰는 이유).
image-publish:migration:
  extends: .image-publish
  variables:
    APP: migration
    DOCKERFILE: infra/migration/Dockerfile # 앱 잡은 비워 두고 apps/$APP/Dockerfile 을 쓴다
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes:
        - db/migration/**/*
        - infra/migration/**/*
        - .dockerignore
        - .gitlab/ci/image.yml
