# 앱 이미지 빌드·ECR 푸시 (live-app, streaming-app).
#
# dev 브랜치 push 에서만 돈다. MR 단계의 검증은 build 잡(테스트·ArchUnit)이 이미 맡았고,
# 이 잡은 "머지된 코드를 배포 가능한 산출물로 만든다" 만 한다. Dockerfile 의 bootJar 는
# 테스트를 돌리지 않는다 — 테스트를 여기서 한 번 더 돌리지 않는 이유가 이것이다.
#
# 인증 (읽고 넘기지 말 것):
#   AWS 정적 키를 CI 변수에 두지 않는다. GitLab 이 잡마다 발급하는 OIDC 토큰(id_tokens)으로
#   ECR_PUSH_ROLE_ARN 역할을 맡는다. 역할 쪽 신뢰 조건이 sub 를
#   project_path:sagopanda/sapari-be:ref_type:branch:ref:dev 로 묶으므로, MR 작성자가 자기
#   브랜치에서 이 파일을 고쳐도 역할을 맡지 못한다 — 토큰의 ref 클레임은 GitLab 이 서명한다.
#   (mr-review.yml 의 리뷰 토큰과 다른 점이 이것이다. 그쪽은 변수 자체가 잡 환경에 들어간다.)
#   dev 가 보호 브랜치가 아니면 이 전제가 무너진다 — 누구나 dev 에 push 할 수 있으면 누구나
#   역할을 맡는다. 신뢰 조건에 ref_protected=true 를 더하면 그 경우에도 막힌다.
#
# dind: build 잡과 같은 배선이다(2375, TLS 끔). 그쪽 상단의 신뢰 경계 문단이 그대로 적용된다 —
#   이 잡은 dev 에 머지된 코드만 실행하므로 범위는 오히려 좁다.
#
# 필요 CI 변수 (Settings > CI/CD > Variables, 비밀 아님 — Masked 불필요):
#   ECR_PUSH_ROLE_ARN  Terraform 10-identity 의 ci-ecr-push 역할 ARN
#   ECR_REGISTRY       <계정ID>.dkr.ecr.ap-northeast-2.amazonaws.com
#
# 리포지토리 이름 규칙: sapari-<ENVIRONMENT>-<앱> (21-registry 스택의 이름 규칙과 같다)
#
# 아키텍처: 러너(amd64) 네이티브로 빌드한다. EKS 노드를 Graviton(arm64)으로 정하면
#   buildx 멀티 아키텍처 빌드로 바꿔야 한다 — 기반 이미지는 두 아키텍처를 모두 낸다.

# stages 선언은 .gitlab-ci.yml 이 소유한다 (include 간 덮어쓰기 방지).

image-publish:
  stage: publish
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
  parallel:
    matrix:
      - APP: [live-app, streaming-app]
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    AWS_REGION: "ap-northeast-2"
    ENVIRONMENT: "dev"
    CLAUDE_CODE_OAUTH_TOKEN: "" # claude 미실행 단계
    GITLAB_API_TOKEN: "" # API 호출 없음
  before_script:
    # 변수가 비면 aws cli 가 엉뚱한 자격 체인을 찾다가 알아보기 어려운 오류를 낸다. 먼저 끊는다.
    - test -n "$ECR_PUSH_ROLE_ARN" || { echo "ECR_PUSH_ROLE_ARN 이 비어 있습니다"; exit 1; }
    - test -n "$ECR_REGISTRY" || { echo "ECR_REGISTRY 가 비어 있습니다"; exit 1; }
    - apk add --no-cache aws-cli >/dev/null
    # aws cli 는 이 세 변수가 있으면 AssumeRoleWithWebIdentity 를 스스로 부른다.
    - echo "$AWS_ID_TOKEN" > /tmp/web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/web-identity-token
    - export AWS_ROLE_ARN="$ECR_PUSH_ROLE_ARN"
    - export AWS_ROLE_SESSION_NAME="gitlab-$CI_PIPELINE_ID-$APP"
    - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    # 태그는 커밋 SHA 하나. latest 를 쓰지 않는다 — 어느 커밋이 떠 있는지 이미지 이름으로 갈려야
    # 롤백이 "이전 SHA 로 되돌리기" 한 줄이 된다.
    - IMAGE="$ECR_REGISTRY/sapari-$ENVIRONMENT-$APP:$CI_COMMIT_SHORT_SHA"
    - docker build -f "apps/$APP/Dockerfile" -t "$IMAGE" .
    - docker push "$IMAGE"
    - echo "푸시 완료 $IMAGE"
