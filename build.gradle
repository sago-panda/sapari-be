plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

allprojects {
    group = 'com.sapari'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.springframework.boot'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testCompileOnly 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    tasks.named('test') {
        useJUnitPlatform()
        failOnNoDiscoveredTests = false

        // @Tag("context") 제외 규칙은 <b>없다</b>(2026-10-31 제거).
        //
        // 종전 근거는 "application*.yaml 이 .gitignore 대상이라 클론에 설정이 없고, 설정을 CI 변수로
        // 채우는 길은 룸토큰 개인키를 CI 에 넣는 것이라 택하지 않았다" 였다. <b>그 전제가 틀렸다</b> —
        // 룸 토큰 키는 외부 의존이 없는 프로퍼티라 테스트가 키쌍을 만들어 넣으면 되고, 인프라는
        // Testcontainers 가, 스키마는 운영 마이그레이션(Flyway)이 세운다. 시크릿이 필요하지 않다.
        //
        // 그 제외가 비싸게 굴었다: live-app 의 "지표가 사용자 포트에 열리지 않는다" 가드가 파이프라인에서
        // 비어 있었고, CI 로 옮기자마자 두 가지가 드러났다 — 노출 목록이 빠지면 프로메테우스가 401 이
        // 되고(지표가 조용히 빈다), health 가 Mongo 에 걸려 있다(컨테이너 없으면 503).
        //
        // 그래서 거를 것이 없다. 새 테스트가 설정을 요구하면 그 테스트가 공급하는 쪽이고,
        // 공급하지 못하는 것이 생기면 그때 이 자리를 다시 열 것 — 다만 "개인키를 CI 에" 는
        // 더 이상 근거가 아니다.
    }

    bootJar {
        enabled = false
    }

    jar {
        enabled = true
    }
}

bootJar {
    enabled = false
}

jar{
    enabled = false
}

// javadoc 오배치 검사 — 루트 check에 물린다(전 모듈 소스를 한 번에 훑으므로 모듈마다 걸지 않는다)
apply from: "$rootDir/gradle/orphan-javadoc.gradle"