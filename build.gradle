plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

allprojects {
    group = 'com.sapari'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.springframework.boot'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testCompileOnly 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    tasks.named('test') {
        useJUnitPlatform()
        failOnNoDiscoveredTests = false

        // @Tag("context") 는 애플리케이션 컨텍스트를 실제로 띄우는 테스트다. CI 에서 제외한다.
        // application*.yaml 이 .gitignore 대상이라 클론에 설정이 없고, 설정 없이 띄우면
        // 데이터소스·LiveKit·룸토큰 프로퍼티가 연쇄로 없어 반드시 실패한다.
        // 설정을 CI 변수로 채우는 길은 룸토큰 개인키를 CI 에 넣는 것이라 택하지 않았다.
        // 로컬에서는 개발자 설정으로 그대로 돈다 — 이 테스트가 값어치를 갖는 자리도 거기다.
        //
        // 이름(*ApplicationTests)이 아니라 태그로 거르는 이유: 이름 규칙이면 그 이름을 쓰는
        // 새 테스트가 CI 에서 조용히 영구 미실행이 된다. 태그를 안 붙이면 CI 가 시끄럽게
        // 실패하고, 그때 붙이면 된다 — 실패 방향이 안전한 쪽이다.
        //
        // @Tag("docker") 는 Testcontainers 로 실제 컨테이너를 띄우는 테스트다(.gitlab/ci/build.yml 의
        // build 잡은 image 만 있고 services 가 없어 Docker 데몬이 없다 — 그 잡이 외부 서비스를 붙이지
        // 않는 이유는 같은 파일 상단에 적혀 있다). 여기 남는 사각지대가 크다: 락 경합 검증이 CI 에서
        // 돌지 않으므로, 락이 깨지는 회귀는 로컬에서 이 테스트를 돌려야만 잡힌다. 러너에 dind 를
        // 붙일 수 있게 되면 이 태그부터 제외 목록에서 빼는 게 맞다.
        if (System.getenv('CI')) {
            useJUnitPlatform { excludeTags 'context', 'docker' }
        }
    }

    bootJar {
        enabled = false
    }

    jar {
        enabled = true
    }
}

bootJar {
    enabled = false
}

jar{
    enabled = false
}