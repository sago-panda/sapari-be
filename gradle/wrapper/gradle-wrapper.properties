distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
# 배포판 무결성 고정. gradlew 는 이 파일의 URL 에서 받은 zip 을 그대로 실행하므로,
# 이 한 줄이 없으면 URL 만 바꿔치기해도 CI 러너에서 임의 코드가 돈다
# (.gitlab/ci/build.yml 상단의 신뢰 경계 참고). 해시가 다르면 gradlew 가 거부하고 멈춘다.
# ⚠️ Gradle 버전을 올릴 때 이 값도 함께 갱신할 것 — 안 하면 빌드가 지문 불일치로 멈춘다.
#    `./gradlew wrapper --gradle-version <ver> --distribution-type bin` 이 자동으로 갱신한다.
distributionSha256Sum=2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
