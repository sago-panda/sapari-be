// 아키텍처 규칙(ArchUnit) 전용 테스트 모듈.
// 검사 대상 모듈들을 test 의존으로 끌어와 전 클래스를 분석한다. (어느 앱에도 묶이지 않음)
dependencies {
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // 분석 대상 자동 포함: 공통 토대(common/*, storage/*) + 도메인 모듈(modules/*/*-api, *-core).
    // 새 토대/도메인 모듈을 추가해도 여기를 손대지 않아도 검사 대상이 된다(룰6 토대↛modules 빈틈 방지).
    // (settings.gradle이 build 디렉터리도 프로젝트로 포함하므로 'build'는 제외)
    rootProject.subprojects
            .findAll { sp ->
                sp.name != 'build' && (
                        sp.path.startsWith(':common:')
                                || sp.path.startsWith(':storage:')
                                || (sp.path.startsWith(':modules:')
                                        && (sp.name.endsWith('-api') || sp.name.endsWith('-core')))
                )
            }
            .each { add('testImplementation', it) }
}

tasks.register("prepareKotlinBuildScriptModel"){}
