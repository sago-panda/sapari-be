// 아키텍처 규칙(ArchUnit) 전용 테스트 모듈.
// 검사 대상 모듈들을 test 의존으로 끌어와 전 클래스를 분석한다. (어느 앱에도 묶이지 않음)
dependencies {
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation project(':common:core')
    testImplementation project(':common:web')
    testImplementation project(':common:auth')
    testImplementation project(':common:global')

    // 모든 도메인 모듈(modules/*/*-api, *-core)을 분석 대상에 자동 포함.
    // → 새 도메인 모듈을 추가해도 여기를 손대지 않아도 자동으로 검사 대상이 된다.
    // (settings.gradle이 build 디렉터리까지 프로젝트로 포함하므로, -api/-core로 끝나는 실제 모듈만 추린다)
    rootProject.subprojects
            .findAll { it.path.startsWith(':modules:') && (it.name.endsWith('-api') || it.name.endsWith('-core')) }
            .each { add('testImplementation', it) }
}

tasks.register("prepareKotlinBuildScriptModel"){}
