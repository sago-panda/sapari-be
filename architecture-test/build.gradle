// 아키텍처 규칙(ArchUnit) 전용 테스트 모듈.
// 검사 대상 모듈들을 test 의존으로 끌어와 전 클래스를 분석한다. (어느 앱에도 묶이지 않음)
dependencies {
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // 분석 대상 자동 포함: 공통 토대(common/*, storage/*) + 도메인 모듈(modules/*/*-api, *-core).
    // 새 토대/도메인 모듈을 추가해도 여기를 손대지 않아도 검사 대상이 된다(룰6 토대↛modules 빈틈 방지).
    // (settings.gradle이 build 디렉터리도 프로젝트로 포함하므로 'build'는 제외)
    rootProject.subprojects
            .findAll { sp ->
                sp.name != 'build' && (
                        sp.path.startsWith(':common:')
                                || sp.path.startsWith(':storage:')
                                || (sp.path.startsWith(':modules:')
                                        && (sp.name.endsWith('-api') || sp.name.endsWith('-core')))
                )
            }
            .each { add('testImplementation', it) }

    // apps는 위 자동 포함 필터(common/storage/modules)에서 빠지므로, 검사 대상인 앱만 여기에 명시한다.
    // 스택이 갈린다(streaming=WebFlux, live=MVC). 스택 오용 규칙은 "누가 무엇을 호출하는가"를 보므로
    // 호출하는 쪽 클래스가 여기 없으면 규칙이 검사할 대상을 못 찾는다. ArchUnit은 그때 조용히 넘어가지 않고
    // 실패시키므로(failOnEmptyShould 기본값) 앱을 빼면 빌드가 깨진다 — 규칙을 지우거나 앱을 넣거나 둘 중 하나다.
    // 앱을 빠뜨리면 그 앱 코드는 어떤 규칙의 검사도 받지 않는다. 스케줄러·필터·설정이
    // 앱에 살기 때문에 @Transactional 위치와 TimeProvider 규칙이 조용히 비게 된다.
    //
    // ⚠️ 그 기본값에 <규칙 둘이 정확성을 걸고 있다> — 대상 집합이 비면 그 규칙은 "검사할 것이
    // 없다" 로 초록이 되는 게 아니라 실패해야 한다. 실측(2026-11-05), 둘 다 실패한다:
    //   only_the_refresh_handler_may_install_a_profanity_filter — 메서드명을 문자열로 박았다.
    //     install 이 사라지거나 이름이 바뀌면 대상 0건이고, 그때 초록이면 "아무도 필터를 갈아
    //     끼우지 않는다" 를 통과로 읽는다.
    //   mapstruct_mappers_must_fail_on_unmapped_targets — 대상이 @Mapper 로 <발견되는> 집합이다.
    //     애노테이션 FQN 을 없는 것으로 바꾸면 "failed to check any classes" 로 깨진다.
    // 그래서 allowEmptyShould 를 켜지 말 것 — 켜는 순간 이 둘이 조용한 통과가 된다.
    testImplementation project(':apps:streaming-app')
    testImplementation project(':apps:api-app')
    testImplementation project(':apps:live-app')
    testImplementation project(':apps:admin-app')
    testImplementation project(':apps:batch-app')
}

tasks.register("prepareKotlinBuildScriptModel"){}
